<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Annealed banner candidates</title>
    <style>
      @font-face {
        font-family: "Atkinson Hyperlegible Next";
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("../theme/static/fonts/atkinson-hyperlegible-next-latin.woff2")
          format("woff2");
      }

      :root {
        color-scheme: dark;
        font-family: "Atkinson Hyperlegible Next", "Segoe UI", sans-serif;
        color: #f1eee7;
        background: #11161c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 1080px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.65rem;
      }

      p {
        max-width: 68ch;
        margin: 0 0 2.5rem;
        color: #aab4c2;
      }

      figure {
        margin: 0 0 2.5rem;
      }

      .banner {
        position: relative;
        min-height: 168px;
        overflow: hidden;
        background: #142033;
      }

      .banner img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
  		filter: brightness(0.8) saturate(0.9);
      }

      .identity {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 168px;
        flex-direction: column;
        justify-content: flex-end;
        gap: 0.25rem;
        width: min(100% - 40px, 820px);
        margin: 0 auto;
        padding-bottom: 1.15rem;
        text-shadow: 0 1px 2px #0b0f14;
      }

      .identity strong {
        font-size: 1.35rem;
      }

      .identity nav {
        display: flex;
        gap: 1.25rem;
      }

      .identity a {
        color: #f1eee7;
        text-decoration: none;
      }

      .identity a:hover {
        color: #ffc46b;
        text-decoration: underline;
        text-underline-offset: 0.18em;
      }

      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 0.55rem;
        color: #aab4c2;
        font-size: 0.9rem;
      }

      figcaption a {
        color: #f5a340;
        text-decoration: none;
      }

      figcaption a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Annealed banner preview</h1>
    <p>
      This mock masthead shows the current output. Adjust the configuration near
      the top of <code>generate.py</code>, run it again, and refresh this page.
    </p>

    <figure>
      <div class="banner">
        <img src="output/banner.svg" alt="">
        <div class="identity">
          <strong>Lorenzo</strong>
          <nav><a href="#">Home</a><a href="#">Articles</a></nav>
        </div>
      </div>
      <figcaption>
        <span>Current generated result</span>
        <a href="output/banner-crop.jpg">source crop</a>
      </figcaption>
    </figure>
  </body>
</html>
