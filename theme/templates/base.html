<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}{{ SITESUBTITLE }}{% endblock %}">
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <script>
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/style.css">
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead-inner">
        <a class="site-name" href="{{ SITEURL }}/">{{ SITENAME }}</a>
        <nav aria-label="Main navigation">
          <a href="{{ SITEURL }}/">Home</a>
          <a href="{{ SITEURL }}/articles/">Articles</a>
        </nav>
      </div>
    </header>

    <main class="wrap">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <small>© 2026 Lorenzo Tumini</small>
        <button class="theme-toggle" type="button" aria-label="Switch to light mode" hidden>
          <span aria-hidden="true">☼</span>
        </button>
      </div>
    </footer>

    <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/js/theme.js" defer></script>
  </body>
</html>
