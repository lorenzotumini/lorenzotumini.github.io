{% extends "base.html" %}

{% block title %}{{ article.title }} — {{ SITENAME }}{% endblock %}
{% block description %}{{ article.summary|striptags }}{% endblock %}

{% block content %}
  <article class="prose">
    <header class="article-heading">
      <h1>{{ article.title }}</h1>
      <time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time>
    </header>

    {{ article.content }}
  </article>
{% endblock %}
